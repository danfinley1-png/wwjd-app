name: wwjd_app
description: WWJD - What Would Jesus Do? Catholic Moral Advisor
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  intl: ^0.20.2
  share_plus: ^10.0.0
  flutter_markdown: ^0.6.18
  url_launcher: ^6.3.0
  uuid: ^4.5.1
  
  # Firebase (updated versions)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  
  # Speech & TTS (keep)
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2
  
  # Google Sign-In (keep)
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/wwjd_header.jpg